# goneat assess configuration for ipcprims
# Rust project with FFI bindings
#
# goneat v0.6.0 runs baseline Rust lint, but does not parse a rust: block here
# or configure target, features, all-targets, deny-warnings, or toolchain.
# Makefile's direct Cargo Clippy calls fill that gap until configurable Rust
# lint support is available upstream. This config handles ancillary files.
version: 1
lint:
  # YAML linting (CI workflows, configs)
  yamllint:
    enabled: true
    strict: true
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".goneat/**/*.yaml"
    ignore: []
  # Go linting note:
  # goneat currently runs golangci-lint from the repo root. To support that while keeping
  # Go bindings in a submodule, we include:
  # - a minimal root go.mod
  # - a root go.work referencing bindings/go/ipcprims
  # - a tiny placeholder Go package (internal/gowork) so repo-root ./... resolves
  #
  # CI still runs Go tests from bindings/go/ipcprims directly.

  # Shell script linting
  shell:
    shfmt:
      enabled: true
      fix: true
    shellcheck:
      enabled: false
      path: ""
    paths:
      - "**/*.sh"
      - "scripts/**/*.sh"
    ignore:
      - "**/target/**"
      - "**/.git/**"
  # GitHub Actions linting
  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore: []
  # Makefile linting
  make:
    checkmake:
      enabled: true
      config:
        max_body_length: 90  # Bootstrap/tools targets can be complex
        min_phony_targets:
          - all
          - clean
          - test
          - check
          - build
    paths:
      - "**/Makefile"
    ignore: []
